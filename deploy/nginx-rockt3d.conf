# Static hosting of the in-browser 3D simulator (built by deploy/build_web.py).
# The simulation runs on the player's computer; this server only sends files.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /var/www/rockt3d;
    index index.html;

    gzip on;
    gzip_types application/javascript text/css application/json application/wasm text/x-python text/plain;
    location ~ \.py$ {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-cache";
    }

    # The package index names the wheel files (and their sha256): always
    # revalidate it, or a returning browser asks for files of an older build
    # (e.g. the full scipy wheel, replaced by the trimmed one).
    location = /pyodide/pyodide-lock.json {
        add_header Cache-Control "no-cache";
    }

    # Pyodide runtime and wheels: large, versioned with the build, cache long.
    location /pyodide/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # App files and simulator sources: always revalidate (cheap 304s).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
